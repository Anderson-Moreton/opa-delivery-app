<div class="success-page">
  <div class="success-card">
    <div class="success-icon">✅</div>

    <h1>Pedido realizado!</h1>

    <p class="message">Seu pedido foi enviado para preparação</p>

    <div class="details">
      <div class="detail-item">
        <span>Pedido</span>
        <strong>#{{ randomOrder }}</strong>
      </div>

      <div class="detail-item">
        <span>Tempo estimado</span>
        <strong>30–40 min</strong>
      </div>

      <div class="detail-item">
        <span>Status</span>
        <strong>Preparando</strong>
      </div>
    </div>

    <div class="buttons">
      <button class="menu-btn" routerLink="/">Voltar ao Menu</button>

      <button class="orders-btn">Meus Pedidos</button>
    </div>
  </div>
</div>
