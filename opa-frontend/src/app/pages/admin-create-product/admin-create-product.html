<div class="create-product-page">
  <div class="form-card">
    <h1>
      {{ editMode ? 'Editar Produto' : 'Cadastrar Produto' }}
    </h1>

    <!-- NAME -->
    <div class="form-group">
      <label> Nome do Produto </label>

      <input type="text" placeholder="Digite o nome" [(ngModel)]="name" />
    </div>

    <!-- DESCRIPTION -->
    <div class="form-group">
      <label> Descrição </label>

      <textarea rows="4" placeholder="Digite a descrição" [(ngModel)]="description"> </textarea>
    </div>

    <!-- PRICE -->
    <div class="form-group">
      <label> Preço </label>

      <input type="number" placeholder="Digite o preço" [(ngModel)]="price" />
    </div>

    <!-- CATEGORY -->
    <div class="form-group">
      <label> Categoria </label>

      <select [(ngModel)]="category" (change)="onCategoryChange()">
        <option *ngFor="let category of categories" [value]="category.name">
          {{ category.name }}
        </option>
      </select>
    </div>

    <!-- IMAGE -->
    <div class="form-group">
      <label> Imagem do Produto </label>

      <input type="text" placeholder="URL da imagem" [(ngModel)]="image" />
    </div>

    <!-- ACTIONS -->
    <div class="form-actions">
      <button class="cancel-btn" routerLink="/admin/dashboard" type="button">Cancelar</button>

      <button class="save-btn" (click)="saveProduct()">
        {{ editMode ? 'Salvar Alterações' : 'Salvar Produto' }}
      </button>
    </div>
  </div>
</div>
