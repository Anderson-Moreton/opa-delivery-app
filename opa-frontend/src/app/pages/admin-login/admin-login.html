<div class="admin-login-page">

  <div class="login-card">

    <h1>Painel Admin</h1>

    <div class="form-group">
      <label>Email</label>

      <input
        type="email"
        placeholder="Digite o email"
        [(ngModel)]="email"
      >
    </div>

    <div class="form-group">
      <label>Senha</label>

      <input
        type="password"
        placeholder="Digite a senha"
        [(ngModel)]="password"
      >
    </div>

    <button (click)="login()">
      Entrar
    </button>

  </div>

</div>
