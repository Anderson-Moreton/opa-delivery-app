<div class="page">
  <app-header></app-header>

  <main class="payment-container">
    <div class="payment-card">
      <h1>Finalizar Pedido</h1>

      <h3 class="welcome">Olá, {{ userName }}</h3>

      <div class="form-group">
        <label> Endereço de entrega </label>

        <input type="text" [(ngModel)]="address" placeholder="Digite seu endereço" />
      </div>

      <div class="form-group">
        <label> Método de pagamento </label>

        <select [(ngModel)]="paymentMethod" (ngModelChange)="onPaymentMethodChange()">
          <option value="" disabled selected>Selecione uma forma de pagamento</option>

          <option value="pix">PIX</option>

          <option value="card">Cartão de Crédito/Débito</option>

          <option value="cash">Dinheiro</option>
        </select>
      </div>

      <!-- PIX -->

      <div *ngIf="paymentMethod === 'pix'" class="payment-details">
        <h4>Pagamento via PIX</h4>

        <p class="pix-instruction">Escaneie o QR Code para realizar o pagamento.</p>

        <div *ngIf="showPix">
          <img [src]="pixQrCode" alt="QR Code PIX" class="pix-qrcode" />

          <label>Código PIX Copia e Cola</label>

          <textarea class="pix-code" readonly
            >{{ pixCode }}
          </textarea>

          <div class="pix-copy-container">
            <button class="secondary-btn" (click)="copyPixCode()">Copiar código PIX</button>
          </div>
        </div>
      </div>

      <!-- CARD -->

      <div *ngIf="paymentMethod === 'card'" class="payment-details">
        <input type="text" placeholder="Nome impresso no cartão" [(ngModel)]="cardName" />

        <div id="card-element"></div>

        <select [(ngModel)]="installments">
          <option [value]="1">1x sem juros</option>
          <option [value]="2">2x sem juros</option>
          <option [value]="3">3x sem juros</option>
        </select>
      </div>

      <!-- CASH -->

      <div *ngIf="paymentMethod === 'cash'" class="payment-details">
        <label>
          <input type="checkbox" [(ngModel)]="needChange" />

          Precisa de troco
        </label>

        <input
          *ngIf="needChange"
          type="number"
          placeholder="Troco para quanto?"
          [(ngModel)]="changeFor"
        />
      </div>

      <div *ngIf="paymentError" class="payment-error">
        {{ paymentError }}
      </div>

      <button
        *ngIf="paymentMethod !== 'pix'"
        class="pay-btn"
        (click)="confirmOrder()"
        [disabled]="isProcessing"
      >
        {{ isProcessing ? 'Processando...' : 'Confirmar Pedido' }}
      </button>
    </div>

    <div class="summary-card">
      <h2>Resumo do Pedido</h2>

      <div class="summary-item" *ngFor="let item of cartItems">
        <span>
          {{ item.name }}

          x{{ item.quantity }}
        </span>

        <span> R$ {{ item.price * item.quantity }} </span>
      </div>

      <hr />

      <h3>Total: R$ {{ total }}</h3>
    </div>
  </main>

  <app-footer></app-footer>
</div>
