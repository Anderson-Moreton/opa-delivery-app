<app-header></app-header>

<div class="orders-container">
  <h1>Meus Pedidos</h1>

  <div *ngIf="orders.length === 0" class="empty-orders">
    <div class="empty-icon">📦</div>

    <h2>Você ainda não possui pedidos</h2>

    <p>Quando realizar seu primeiro pedido, ele aparecerá aqui.</p>

    <a routerLink="/" class="menu-btn"> Ver Cardápio </a>
  </div>

  <ng-container *ngIf="orders.length > 0">
    <div class="order-card" *ngFor="let order of orders">
      <div class="order-info">
        <span>#{{ order.id }}</span>

        <span>
          {{ order.created_at | date: 'dd/MM/yyyy HH:mm' }}
        </span>

        <span>R$ {{ order.total }}</span>

        <span class="status">
          {{ getStatusLabel(order.status) }}
        </span>

        <a class="details-btn" [routerLink]="['/orders', order.id]"> Ver Pedido </a>
      </div>
    </div>
  </ng-container>
</div>

<app-footer></app-footer>
