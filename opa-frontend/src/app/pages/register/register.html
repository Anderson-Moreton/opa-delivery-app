<div class="page">
  <app-header></app-header>

  <main>
    <div class="register-container">
      <h2>Criar conta</h2>

      <form (ngSubmit)="register()">
        <!-- Dados pessoais -->
        <div class="section-title">Dados pessoais</div>

        <div class="form-group">
          <label>Nome completo</label>

          <input type="text" [(ngModel)]="name" name="name" placeholder="Digite seu nome" />
        </div>

        <div class="form-group">
          <label>Email</label>

          <input type="email" [(ngModel)]="email" name="email" placeholder="Digite seu email" />
        </div>

        <div class="form-group">
          <label>Telefone</label>

          <div class="phone-group">
            <select [(ngModel)]="ddd" name="ddd">
              <option value="">DDD</option>

              <option value="11">11</option>
              <option value="21">21</option>
              <option value="31">31</option>
              <option value="41">41</option>
              <option value="51">51</option>
              <option value="61">61</option>
              <option value="71">71</option>
              <option value="81">81</option>
            </select>

            <input type="text" [(ngModel)]="phone" name="phone" placeholder="99999-9999" />
          </div>
        </div>

        <div class="form-group">
          <label>Senha</label>

          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Digite sua senha"
          />
        </div>

        <div class="form-group">
          <label>Confirmar senha</label>

          <input
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Confirme sua senha"
          />
        </div>

        <!-- Endereço -->
        <div class="section-title">Endereço de entrega</div>

        <div class="form-group">
          <label>CEP</label>

          <input
            type="text"
            [(ngModel)]="cep"
            name="cep"
            placeholder="Digite seu CEP"
            (input)="searchCep()"
          />
        </div>

        <div class="form-group">
          <label>Rua</label>

          <input type="text" [(ngModel)]="street" name="street" placeholder="Digite sua rua" />
        </div>

        <div class="form-group">
          <label>Número</label>

          <input type="text" [(ngModel)]="number" name="number" placeholder="Número" />
        </div>

        <div class="form-group">
          <label>Bairro</label>

          <input
            type="text"
            [(ngModel)]="neighborhood"
            name="neighborhood"
            placeholder="Digite seu bairro"
          />
        </div>

        <div class="form-group">
          <label>Cidade</label>

          <input type="text" [(ngModel)]="city" name="city" placeholder="Digite sua cidade" />
        </div>

        <div class="form-group">
          <label>Complemento</label>

          <input
            type="text"
            [(ngModel)]="complement"
            name="complement"
            placeholder="Apartamento, bloco..."
          />
        </div>

        <button type="submit">Cadastrar</button>
      </form>
    </div>
  </main>

  <app-footer></app-footer>
</div>
