<app-header></app-header>

<div class="account-container" *ngIf="user">
  <div class="account-card">
    <h1>Minha Conta</h1>

    <div class="field">
      <label>Nome</label>

      <p *ngIf="!editing">
        {{ user.name }}
      </p>

      <input *ngIf="editing" type="text" [(ngModel)]="formData.name" />
    </div>

    <div class="field">
      <label>Email</label>

      <p>
        {{ user.email }}
      </p>
    </div>

    <div class="field">
      <label>Telefone</label>

      <p *ngIf="!editing">
        {{ user.phone }}
      </p>

      <input *ngIf="editing" type="text" [(ngModel)]="formData.phone" />
    </div>

    <div class="field">
      <label>CEP</label>

      <p *ngIf="!editing">
        {{ user.cep }}
      </p>

      <input *ngIf="editing" type="text" [(ngModel)]="formData.cep" />
    </div>

    <div class="field">
      <label>Endereço</label>

      <p *ngIf="!editing">
        {{ user.address }}
      </p>

      <input *ngIf="editing" type="text" [(ngModel)]="formData.address" />
    </div>

    <div class="field">
      <label>Perfil</label>

      <p>
        {{ user.role === 'admin' ? 'Administrador' : 'Cliente' }}
      </p>
    </div>

    <div class="button-container" *ngIf="!editing">
      <button class="edit-btn" (click)="editing = true">Editar Dados</button>
    </div>

    <div class="button-container" *ngIf="editing">
      <button class="save-btn" (click)="saveUser()">Salvar</button>

      <button class="cancel-btn" (click)="cancelEdit()">Cancelar</button>
    </div>
  </div>
</div>

<app-footer></app-footer>
