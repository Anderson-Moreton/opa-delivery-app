<div class="page public-layout">
  <app-header></app-header>

  <app-toast></app-toast>

  <div class="page">
    <main>
      <!-- Banner -->
      <section class="contact-banner">
        <img src="assets/img/mensagem.jpg" alt="Contato" />

        <div class="banner-overlay">
          <h1>Envie-nos uma mensagem</h1>
        </div>
      </section>

      <!-- Contact Form -->
      <section class="contact-content">
        <form class="contact-form" (ngSubmit)="sendMessage()">
          <div class="form-group">
            <label>Nome Completo</label>

            <input type="text" [(ngModel)]="name" name="name" placeholder="Digite seu nome" />
          </div>

          <div class="form-group">
            <label>E-mail</label>

            <input type="email" [(ngModel)]="email" name="email" placeholder="Digite seu e-mail" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Telefone</label>

              <input
                type="text"
                [(ngModel)]="phone"
                name="phone"
                placeholder="Digite seu telefone"
              />
            </div>

            <div class="form-group">
              <label>Cidade</label>

              <input type="text" [(ngModel)]="city" name="city" placeholder="Digite sua cidade" />
            </div>

            <div class="form-group">
              <label>Estado</label>

              <select [(ngModel)]="state" name="state">
                <option value="">Selecione</option>

                <option value="AC">AC</option>
                <option value="AL">AL</option>
                <option value="AP">AP</option>
                <option value="AM">AM</option>
                <option value="BA">BA</option>
                <option value="CE">CE</option>
                <option value="DF">DF</option>
                <option value="ES">ES</option>
                <option value="GO">GO</option>
                <option value="MA">MA</option>
                <option value="MT">MT</option>
                <option value="MS">MS</option>
                <option value="MG">MG</option>
                <option value="PA">PA</option>
                <option value="PB">PB</option>
                <option value="PR">PR</option>
                <option value="PE">PE</option>
                <option value="PI">PI</option>
                <option value="RJ">RJ</option>
                <option value="RN">RN</option>
                <option value="RS">RS</option>
                <option value="RO">RO</option>
                <option value="RR">RR</option>
                <option value="SC">SC</option>
                <option value="SP">SP</option>
                <option value="SE">SE</option>
                <option value="TO">TO</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Mensagem</label>

            <textarea
              rows="8"
              [(ngModel)]="message"
              name="message"
              placeholder="Digite sua mensagem"
            ></textarea>
          </div>

          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>
  </div>

  <app-footer></app-footer>
</div>
