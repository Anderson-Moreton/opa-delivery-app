<div class="dashboard">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h1>OPA Admin</h1>

    <button routerLink="/admin/create-product">Cadastrar Produto</button>

    <button routerLink="/admin/categories">Adicionar / Editar Categoria</button>
  </aside>

  <!-- CONTENT -->
  <main class="content">
    <h2>Produtos Cadastrados</h2>

    <div class="products-section">
      <!-- DYNAMIC CATEGORIES -->
      <div class="category-box" *ngFor="let category of categories">
        <h3>
          {{ category.name }}
        </h3>

        <!-- PRODUCTS -->
        <div class="product-item" *ngFor="let product of category.products">
          <div class="product-left">
            <img [src]="product.image" [alt]="product.name" />

            <div class="product-info">
              <strong>
                {{ product.name }}
              </strong>

              <p>
                {{ product.description }}
              </p>
            </div>
          </div>

          <!-- ACTIONS -->
          <div class="actions">
            <button class="edit-btn" [routerLink]="['/admin/edit-product', product.id]">
              Editar
            </button>

            <button class="delete-btn" (click)="deleteProduct(product.id)">Excluir</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
