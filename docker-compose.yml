version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: opa_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: opa_db_dev
    ports:
      - "3307:3306"   # ⚠️ muda porta!
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: